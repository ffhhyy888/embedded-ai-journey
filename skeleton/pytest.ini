; ============================================================
; pytest 配置 —— 测试分层
; ============================================================
; 分层是为了让 CI 能"只跑不需要硬件的那一半"：
;   层1（CI，每次提交都能跑，**默认**）:  pytest
;   层2（真机，必须显式指定）         :  pytest -m hardware
;
; 为什么要分：真机用例依赖"板子插着、串口连好、调试器可用"。
; 它们很好，但不能作为"持续"的基础 —— 硬件一旦掉线，CI 就变成随机红灯，
; 大家很快就不再相信红灯了。
;
; ⚠️ 默认排除 hardware（见下面的 addopts）：光是敲 `pytest` **不会**碰硬件。
;    这是有意的 —— 谁也不想在一次"看看测试过不过"的操作里意外占用串口。
;    要跑真机用例就显式加 `-m hardware`（命令行会覆盖 addopts 里的 -m）。
;    ⚠️ 程序化调用同样必须显式：如 tools/hil.py 调 pytest 时带了 `-m hardware`。

[pytest]
testpaths = tests
addopts = -ra -m "not hardware"
markers =
    hardware: 需要真机（开发板 / 串口 / 调试器）才能运行的用例
    nohardware: 不依赖任何硬件的用例（CI 层1 跑这些）
