; ============================================================
; pytest 配置 —— 测试分层
; ============================================================
; 分层是为了让 CI 能"只跑不需要硬件的那一半"：
;   层1（CI，每次提交都能跑）:  pytest -m "not hardware"
;   层2（真机，按需/自托管） :  pytest -m hardware
;
; 为什么要分：真机用例依赖"板子插着、串口连好、调试器可用"。
; 它们很好，但不能作为"持续"的基础 —— 硬件一旦掉线，CI 就变成随机红灯，
; 大家很快就不再相信红灯了。

[pytest]
testpaths = tests
addopts = -ra
markers =
    hardware: 需要真机（开发板 / 串口 / 调试器）才能运行的用例
    nohardware: 不依赖任何硬件的用例（CI 层1 跑这些）
